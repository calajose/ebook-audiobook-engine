[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebook-audiobook-engine"
version = "0.2.0a0"
description = "Local audiobook-conversion engine with pluggable TTS backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<1",
    "rich>=13,<14",
    "ebooklib>=0.18",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "requests>=2.31",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.3",
    "mypy>=1.9",
]
all = [
    "ebook-audiobook-engine[kokoro,api,dev]",
]

[project.scripts]
audiobook-engine = "audiobook_engine.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_engine"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-v"]
